name: Repair Chrome recording
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-recording.yml'
      - 'docs/recording-repair/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repair-chrome-recording
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact repair revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - name: Set explicit software capture resolution and reconcile validation scope
        shell: python
        run: |
          from pathlib import Path
          p = Path('tests/recording_browser.py')
          s = p.read_text()
          old = "          report['adapter']=await page.evaluate('window.__film.renderer.adapterInfo')\n"
          new = old + "          # SwiftShader is CPU rendering: keep the full 960x540 UI, but bound the\n          # real renderer's capture surface so a short scene contains multiple frames.\n          # Do not relax decoded-frame, motion, audio, or lifecycle assertions.\n          if platform.system()=='Linux' and args.backend=='compat':\n            await page.evaluate('window.__film.renderer.resize(true,320,180)')\n          report['renderResolution']=await page.evaluate('({width:window.__film.renderer.width,height:window.__film.renderer.height})')\n"
          if new not in s:
              assert old in s, 'Reviewed test changed'
              s = s.replace(old, new, 1)
          p.write_text(s)
          p = Path('docs/CHROME-RECORDING.md')
          s = p.read_text()
          old = '''GitHub Pages is gated on native WebGPU/Chromium on Linux and installed Google Chrome
          on a macOS runner. Native adapter availability/backend, OS and exact browser version
          are included in each report. A hosted macOS runner is not the user's physical Mac;
          when native WebGPU is unavailable there, its report explicitly identifies WebGL2.'''
          new = '''GitHub Pages is gated on explicitly required native WebGPU in installed Google Chrome
          on macOS and a separate Linux WebGL2 compatibility recording check. Backend, OS,
          render resolution and exact browser version are included in each report. A hosted
          macOS runner is not the user's physical Mac. Falling back to WebGL2 cannot satisfy
          the macOS native-WebGPU gate. CPU-rendered Linux smoke captures use 320x180 while
          retaining the full 960x540 application UI; macOS native captures remain 960x540.
          Both paths still require decoded moving video, encoded music and lifecycle tests.
          These tests are functional checks, not high-resolution performance guarantees.'''
          if new not in s:
              assert old in s, 'Reviewed validation scope changed'
              s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check source and regenerate inventory
        run: |
          npm test
          python3 -m compileall -q tools tests
          python3 tools/build_compat.py
          python3 tools/build_single.py
          python3 tools/manifest.py write
          python3 tools/manifest.py check
      - name: Commit source-only verification update
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/recording_browser.py docs/CHROME-RECORDING.md Aether-Orb-Odyssey.html MANIFEST.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Bound software-rendered smoke capture resolution; preserve strict video and audio assertions'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_HEAD" || { echo 'main changed; refusing overwrite'; exit 1; }
          git push origin HEAD:main
