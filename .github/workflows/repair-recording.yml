name: Repair Chrome recording
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-recording.yml'
      - 'docs/recording-repair/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repair-chrome-recording
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact repair revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - name: Refine actual browser regression checks
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          p = Path('tests/recording_browser.py')
          s = p.read_text()
          replacements = [
            ("launch['args']+=['--use-angle=swiftshader'", "launch['args']+=['--use-gl=angle','--use-angle=swiftshader'"),
            ("elif args.chrome:launch['channel']='chrome'", "elif args.chrome:launch['channel']='chrome'\n        else:launch['channel']='chromium' # Full Chromium/new headless, not headless_shell."),
            ("        page.on('pageerror',lambda e:report['errors'].append(str(e)))", "        page.on('pageerror',lambda e:report['errors'].append(str(e)))\n        report['console']=[]\n        page.on('console',lambda m:report['console'].append(m.type+': '+m.text) if m.type in ('warning','error') else None)"),
            ("            await page.goto(origin+'/__capture_probe__')\n            native=await page.evaluate('async()=>!!(await navigator.gpu?.requestAdapter())')\n            if args.backend=='webgpu':assert native,'Native WebGPU adapter unavailable'\n            use_native=native and args.backend!='compat'", "            if args.backend=='auto':\n              await page.goto(origin+'/__capture_probe__')\n              native=await page.evaluate('async()=>!!(await navigator.gpu?.requestAdapter())')\n            else:native=args.backend=='webgpu'\n            use_native=native and args.backend!='compat'"),
            ("          async with page.expect_download(timeout=45000) as dl:\n            await page.evaluate('window.__film.record({from:19.5,to:22.7})')", "          await page.evaluate('window.__film.record({from:19.5,to:22.7})')\n          await page.wait_for_function('window.__film.recorder.state===\"ready\" || window.__film.recorder.state===\"error\"',timeout=45000)\n          assert await page.evaluate('window.__film.recorder.state')=='ready',await page.locator('#recordProgress').inner_text()\n          # Subsequent automatic downloads may need another gesture in Chrome.\n          # Exercise the actual persistent download control, not browser bypass flags.\n          async with page.expect_download(timeout=15000) as dl:\n            await page.locator('#recordDownload').click()"),
            ("          async with page.expect_download(timeout=30000) as dl:\n            await page.evaluate('window.__film.record({from:84.0})')", "          await page.evaluate('window.__film.record({from:84.0})')\n          await page.wait_for_function('window.__film.recorder.state===\"ready\" || window.__film.recorder.state===\"error\"',timeout=30000)\n          assert await page.evaluate('window.__film.recorder.state')=='ready',await page.locator('#recordProgress').inner_text()\n          async with page.expect_download(timeout=15000) as dl:\n            await page.locator('#recordDownload').click()"),
            ("        finally:await browser.close()", "        except BaseException:\n          try:\n            report['failureState']=await page.evaluate('({film:window.__film?.state,recorder:window.__film?.recorder?.diagnostics,audio:window.__film?.soundtrack?.diagnostics,progress:document.querySelector(\"#recordProgress\")?.textContent,fatal:document.querySelector(\"#fatalText\")?.textContent})')\n            await page.screenshot(path=str(out/'failure.png'),timeout=5000)\n          except Exception:pass\n          raise\n        finally:await browser.close()")
          ]
          for old, new in replacements:
              if new in s:
                  continue
              assert old in s, f'Reviewed test changed: {old[:80]}'
              s = s.replace(old, new, 1)
          assert hashlib.sha256(s.encode()).hexdigest() == '2e9c57afe56575ecd01be4e4deae9a033f7515a866e2718254eb6174c68b7ae1', 'Unexpected reconstructed test contents'
          p.write_text(s)
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Ensure audio encoder for existing regression tests
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
      - name: Run source regression tests
        run: |
          npm test
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          for file in src/*.js; do node --check "$file"; done
          python3 -m compileall -q tools tests
      - name: Regenerate standalone edition and complete source inventory
        run: |
          python3 tools/build_compat.py
          python3 tools/build_single.py
          python3 tools/manifest.py write
          python3 tools/manifest.py check
      - name: Commit verified repair without rewriting remote history
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/recording_browser.py Aether-Orb-Odyssey.html MANIFEST.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Test repeat-download gesture recovery and native GPU capture with failure diagnostics'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_HEAD" || { echo 'main changed; refusing overwrite'; exit 1; }
          git push origin HEAD:main
