name: Repair Chrome recording
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-recording.yml'
      - 'docs/recording-repair/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repair-chrome-recording
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact repair revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - name: Fix encoder input-ready ordering
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/app.js')
          s = p.read_text()
          old = "  await paint(from,{force:true}); // Supply a complete initial frame before waiting for onstart.\n  await recorder.ready;\n  if(!await soundtrack.play(from))throw new Error('Recording playback was cancelled.');\n  running=true;started=true;ended=false;$('#gate').hidden=true;\n"
          new = "  await paint(from,{force:true}); // Prime video before awaiting encoder readiness.\n  // Some Chrome encoders wait for input from EVERY track before firing onstart.\n  // Feed the soundtrack and rendering loop first; waiting for ready here would\n  // deadlock a second recording whose previous source has already been stopped.\n  if(!await soundtrack.play(from))throw new Error('Recording playback was cancelled.');\n  running=true;started=true;ended=false;$('#gate').hidden=true;\n  await recorder.ready;\n"
          if new not in s:
              assert old in s, 'Reviewed recording controller changed'
              s = s.replace(old, new, 1)
          p.write_text(s)
          p = Path('docs/CHROME-RECORDING.md')
          s = p.read_text().replace('Current renderer resolution is bounded', 'Recording output resolution is bounded')
          if '## Input-ready ordering' not in s:
              s += '\n## Input-ready ordering\n\nChrome can delay MediaRecorder\'s start event until every input track has supplied\nmedia. A repeated capture must start the soundtrack and the render loop before\nawaiting recorder.ready; otherwise a stopped previous source can starve the audio\ntrack and the preparation phase times out. The real macOS Chrome regression test\nreproduced this condition on a second capture with one video frame and zero bytes.\nBoth tracks are now primed before waiting for readiness, while startup remains\nbounded and failures pause playback and release recording resources.\n'
          p.write_text(s)
          p = Path('.github/workflows/pages.yml')
          s = p.read_text()
          old = 'if [ "$RUNNER_OS" = macOS ]; then FLAGS+=(--chrome); fi'
          new = 'FLAGS+=(--chrome) # Exercise installed stable Chrome on both platforms.'
          if new not in s:
              assert old in s
              s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Ensure audio encoder for existing regression tests
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
      - name: Run source regression tests
        run: |
          npm test
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          for file in src/*.js; do node --check "$file"; done
          python3 -m compileall -q tools tests
      - name: Regenerate standalone edition and complete source inventory
        run: |
          python3 tools/build_compat.py
          python3 tools/build_single.py
          python3 tools/manifest.py write
          python3 tools/manifest.py check
      - name: Commit verified repair without rewriting remote history
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.js docs/CHROME-RECORDING.md .github/workflows/pages.yml Aether-Orb-Odyssey.html MANIFEST.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Start both media inputs before awaiting encoder readiness; validate stable Chrome'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_HEAD" || { echo 'main changed; refusing overwrite'; exit 1; }
          git push origin HEAD:main
