name: Publish Odyssey to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify source inventory
        run: python3 tools/manifest.py check
      - name: Test camera timeline and deployment tooling
        run: |
          npm test
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          bash -n tools/publish-github.sh
          for file in src/*.js; do node --check "$file"; done
          python3 -m compileall -q tools tests
      - name: Verify reproducible generated editions
        run: |
          python3 tools/build_compat.py
          python3 tools/build_single.py
          git diff --exit-code -- shaders/compat-scene.glsl Aether-Orb-Odyssey.html
      - name: Download and verify credited recording
        run: |
          for attempt in 1 2 3; do
            if python3 tools/fetch_music.py; then exit 0; fi
            sleep 5
          done
          echo 'Verified score could not be installed. Refusing silent publication.' >&2
          exit 1
      - name: Build self-contained Pages runtime
        run: python3 tools/build_pages.py
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Check out publication verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify public revision and all runtime assets
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: python3 tools/verify_site.py --url "$SITE_URL" --commit "$EXPECTED_COMMIT" --attempts 12
